---
name: Test stubgenc on pybind11_fixtures
permissions:
  contents: read
concurrency:
  group: "${{ github.event_name == 'pull_request' && format('pr-ci-test_stubgenc.yml-pull_request-{0}', github.event.number || github.run_id) || format('{0}-{1}', github.workflow, github.head_ref || github.run_id) }}"
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: '["misc/test-stubgenc.sh","mypy/stubgenc.py","mypy/stubdoc.py","mypy/stubutil.py","test-data/pybind11_fixtures/**"]'
        CI_IGNORE_PATHS: "[]"
      run: python3 .github/scripts/ci_changes.py
  stubgenc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: "Setup \U0001F40D 3.10"
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.10'
    - name: Test stubgenc
      run: misc/test-stubgenc.sh
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (test_stubgenc.yml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - stubgenc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["stubgenc"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
'on':
  workflow_dispatch:
  push:
    branches:
    - main
    - master
    - release*
    tags:
    - "*"
  pull_request: {}
